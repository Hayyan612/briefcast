# Production stack. Only `web` gets a domain (via the platform's reverse proxy); the API,
# worker, Postgres and Redis stay on the internal network. The browser reaches the API
# through Next.js. Secrets come from .env next to this file (see .env.example).
services:
  web:
    build:
      context: ./frontend
      # Baked into page metadata at build time (absolute link-preview image URLs).
      args:
        APP_URL: ${APP_URL}
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_URL: ${APP_URL}
      BACKEND_URL: http://api:8000
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET}
    depends_on: [api]
    expose: ["3000"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: &backend_env .env
    environment: &backend_overrides
      DATABASE_URL: postgresql+asyncpg://briefcast:${POSTGRES_PASSWORD}@postgres:5432/briefcast
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: *backend_env
    environment: *backend_overrides
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefcast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: briefcast
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefcast"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

volumes:
  pgdata:
  redisdata:
