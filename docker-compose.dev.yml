# Local infrastructure only (Postgres + Redis). Run the apps with uv / npm.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: briefcast
      POSTGRES_PASSWORD: briefcast
      POSTGRES_DB: briefcast
    ports: ["5442:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6392:6379"]
volumes:
  pgdata-dev:
